[package]
name = "carla_physics_spec"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "sim_vehicle_spec's carla_physics.yaml as Rust types: what the CARLA world server applies and acb_bridge applies or reads back"

# Its own workspace: a path dependency of swb_carla_world and acb_bridge, through deps/.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
