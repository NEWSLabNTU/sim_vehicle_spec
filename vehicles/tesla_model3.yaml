# The simulated Tesla Model 3: a plausible real Model 3 RWD on the CARLA Model 3 body's geometry.
#
# This file is the single source of truth for the car, on every simulator and for every
# consumer (roadmap 051). Generated from it, each in the repository that uses it:
#   - here: CARLA's sensor file (generated/tesla_model3/carla_sensors.yaml), CARLA's physics
#     (carla_physics.yaml, roadmap 051 K3) and the SSv2 vehicle catalog (catalogs/vehicles.xosc)
#   - autoware_sim_vehicle: Autoware's vehicle and sensor kit packages (tesla_model3_*)
#   - autoware_isaac_bridge: the Isaac rig its PhysX vehicle and sensors are built from
# and each repository's `just check-generated` fails when one is stale. Every output carries
# this spec's spec_hash. Format: docs/spec-format.md.
#
# Values came from carla-scenario-bridge (csb) as of commit 4aefee8 ("the ego is a plausible
# real Model 3, not CARLA's car", roadmap 043): src/csb_isaac/csb_isaac/vehicle_params.py,
# config/acb_ego.yaml, and acb's vehicle_info / sensor kit calibration it read. The drivetrain,
# the mass and the road loads are the Model 3 RWD's (2024 "Highland", rear 3D7 motor) from
# published data: no drive logs exist to fit against. Values marked under `provenance` with
# `assumed: true` are estimates, not measurements.
spec_version: 2
name: tesla_model3
description: Tesla Model 3 RWD; each simulator runs it on its own body (bodies)

body:
  # The body: CARLA's blueprint id, which is also the key of the Isaac vehicle catalogue
  # (CARLA's vehicles exported to USD, SCENSIM_VEHICLE_USD) and the SSv2 catalog entry's vehicle
  # name. Without an Isaac catalogue the chassis is the box below.
  catalogue_model: vehicle.tesla.model3
  # Unladen: from the road to the underbody's lowest point, between the axles. The Isaac
  # rig puts a skid plate there; a rock or a ridge taller than it strikes the body.
  ground_clearance: 0.138

# What Autoware plans with (vehicle_info), and the PhysX wheel layout. base_link is the rear
# axle centre on the ground, x forward, y left, z up. Metres, radians.
# The real car's geometry. A simulator drives the body of its own asset: `bodies` below.
geometry:
  wheel_base: 2.875
  wheel_tread: 1.580
  wheel_radius: 0.334
  wheel_width: 0.235
  front_overhang: 0.841
  rear_overhang: 0.977
  left_overhang: 0.254
  right_overhang: 0.254
  vehicle_height: 1.443
  # Bicycle-model tire angle limit: a planning limit (acb docs/issues/006), about a real car's
  max_steer_angle: 0.70

# mirror.param.yaml: only Autoware's planning simulator and the sensing crop box read it.
mirror:
  min_longitudinal_offset: 1.8
  max_longitudinal_offset: 3.2
  min_lateral_offset: -1.4
  max_lateral_offset: 1.4
  min_height_offset: 0.8
  max_height_offset: 1.5

inertia:
  mass: 1760.0                # kg, curb (RWD)
  com_front_fraction: 0.47    # share of the static load on the front axle (CoM from rear axle / wheel base)
  com_lateral: 0.0            # m, + left
  com_height: 0.46            # m above the ground
  # Inertia as of a uniform box this size (m): mass/12 x (l^2 + w^2) etc.
  inertia_box: [4.8, 1.9, 1.4]

wheels:
  mass: 20.0                  # kg each; moment of inertia 0.5 m r^2
  damping_rate: 0.25

tires:
  friction: 1.0               # dry asphalt
  lat_stiff_max_load: 2.0     # in rest loads: where lateral stiffness stops growing
  lat_stiff_value: 17.0       # lateral stiffness there, N/rad per N of rest load
  long_stiff_value: 4612.5    # kg (x g: N per unit slip): 10 x a quarter-car rest load
  # Grip (x the table's friction) vs longitudinal slip: full to the peak at 0.1, falling
  # linearly to 0.8 with the wheel locked (provenance: tires.friction_vs_slip)
  friction_vs_slip: [[0.0, 1.0], [0.1, 1.0], [1.0, 0.8]]

brakes:
  max_brake_torque: 3000.0    # N m per wheel: past the tires, so a stop is friction-limited
  hold_brake_torque: 1500.0   # N m per wheel, standing still or in park
  distribution: dynamic_axle_load   # ideal distribution (EBD): front share = dynamic front load
  # The hydraulics (ev): a pure dead time, then the pressure's first-order build-up.
  dead_time: 0.08             # s
  time_constant: 0.06         # s
  # ABS (ev): each wheel's pressure released while its slip is past slip_release and
  # reapplied once it is back within slip_reapply; off below min_speed (m/s).
  abs: {enabled: true, slip_release: 0.25, slip_reapply: 0.15, release_rate: 8.0, apply_rate: 4.0, min_speed: 1.5}

powertrain:
  # The seam (docs/design.md, "Powertrain"): `ideal` realizes Autoware's acceleration as
  # per-wheel torque m a + F_resist(v), the contract acb has on CARLA; `ev` is the Model 3 RWD
  # drive unit below (motor envelope and lag, regen blended with the friction brakes, ABS,
  # traction control). `physx` (PhysX DriveStandard) and `fmu` are reserved.
  model: ev
  max_drive_torque: 1500.0    # N m per wheel (ideal only): ~8 m/s^2
  # ev: one motor on the rear axle through a single-speed reduction and an open differential
  drive_axle: rear
  gear_ratio: 9.03            # Tesla's single-speed reduction (a body scales it to its wheel: bodies)
  motor_peak_torque: 340.0    # N m at the motor, to base speed (194 kW / 340 N m = 5450 rpm)
  motor_peak_power: 194000.0  # W, constant above base speed
  motor_max_rpm: 15200.0      # torque tapers to 0 over the last 5 %: ~201 km/h
  motor_time_constant: 0.04   # s, first-order torque lag (inverter, motor, driveline)
  regen_max_torque: 130.0     # N m at the motor: ~0.2 g at the wheels
  regen_max_power: 60000.0    # W
  regen_fade_speeds: [1.0, 3.0]   # m/s: no regen at or below the first, full at or above the second
  traction_control: {enabled: true, slip_limit: 0.25, slip_reapply: 0.15, release_rate: 20.0, apply_rate: 5.0}

# Road loads, applied to the body as a force (whatever the powertrain): rolling resistance
# Crr m g and aerodynamic drag rho Cd A v^2 / 2. The powertrains' feedforward includes them.
resistance:
  rolling_coefficient: 0.0095
  drag_coefficient: 0.23
  frontal_area: 2.2           # m^2
  air_density: 1.2            # kg/m^3

steering:
  ackermann: true             # the bicycle angle split into Ackermann angles for the front wheels
  time_constant: 0.0          # s, first-order actuator lag; 0: none
  rate_limit: 0.0             # rad/s; 0: none

suspension:
  frequency: 1.6              # Hz, per axle on its own sprung mass, so the car sits level
  damping_ratio: 0.45
  travel: 0.2                 # m

isaac:
  physx:
    # The wheel's spin is stiff against the tire: at 1 substep per 1/60 s braking went unstable
    # and locked the wheels (csb roadmap 043). 8 substeps at every speed and a 4 m/s active
    # slip denominator track the request.
    substeps: 8
    substep_threshold_speed: 5.0
    min_active_slip_denominator: 4.0
    min_passive_slip_denominator: 4.0
    min_lateral_slip_denominator: 1.0
    sticky_tire_threshold_speed: 0.2
    sticky_tire_threshold_time: 1.0
    # Lateral as stiff as longitudinal: at 20 the car parked across a 3 % road camber crept
    # sideways 1.5 cm/s (0.9 m in 60 s, enough to drag NDT off and refuse an engage); at 200,
    # 0.1 cm in 60 s (csb roadmap 059 N8).
    longitudinal_sticky_tire_damping: 200.0
    lateral_sticky_tire_damping: 200.0

# Each simulator's body for this car (roadmap 083): the geometry its asset has, the reduction
# scaled to its wheel (the force at the road and the motor speed per road speed the real
# car's), its catalogue model and its simulator's calibration. Every generator builds a
# simulator's car from the spec as that body (sim_vehicle_spec.spec.effective).
bodies:
  # CARLA 0.9.16's vehicle.tesla.model3; Isaac's ego is the same body (its USD is that asset's).
  carla-0.9.16:
    catalogue_model: vehicle.tesla.model3
    geometry:
      wheel_base: 3.005
      wheel_tread: 1.667
      wheel_radius: 0.370
      wheel_width: 0.235
      front_overhang: 0.807
      rear_overhang: 0.980
      left_overhang: 0.248
      right_overhang: 0.248
      vehicle_height: 1.488
      max_steer_angle: 0.70
    powertrain:
      gear_ratio: 10.0          # 9.03 x 0.370 / 0.334, rounded as it always was
    carla:
      # What CARLA's PhysX vehicle needs beyond the sections above (roadmap 051 K3): the
      # body's own facts and CARLA's scales. carla_physics.yaml derives the rest.
      physics:
        tire_friction_scale: 1.2     # CARLA's tire_friction for a tire friction of 1.0
        drag_area: 3.219             # m^2: what CARLA multiplies its drag coefficient by
        body_com: [0.029, 0.0, 0.744]  # m, actor frame: the centre of mass UE computes for the body
        rear_axle_x: -1.386          # m, actor frame (measured, scensim_carla_world's blueprint table)
        max_steer_angle_deg: 70.0    # the front wheels' limit, which acb_bridge's steering map assumes
        # CARLA's engine is a combustion engine's: an EV motor's rotor is light and drags little.
        engine_moi: 0.05             # kg m^2
        engine_damping: 0.01         # every damping rate of CARLA's engine
  # CARLA 1.0's vehicle.tesla.model3 (Chaos): the real car's dimensions.
  carla-1.0:
    catalogue_model: vehicle.tesla.model3
    geometry:                   # scensim_carla_world blueprint_boxes_1.0.yaml (measured)
      wheel_base: 2.876
      wheel_tread: 1.580
      wheel_radius: 0.336
      wheel_width: 0.235
      front_overhang: 0.841
      rear_overhang: 0.977
      left_overhang: 0.254
      right_overhang: 0.254
      vehicle_height: 1.443
      max_steer_angle: 0.70
    powertrain:
      gear_ratio: 9.084         # 9.03 x 0.336 / 0.334
    carla:
      # CARLA 1.0's Chaos vehicle (roadmap 083 step 5), measured 2026-11-18 on the packaged 1.0
      physics_1_0:
        friction_multiplier_scale: 1.94  # Chaos's friction_force_multiplier for a tire friction of 1.0 (locked-wheel braking: mu = 0.50 x multiplier + 0.035)
        chassis_area: 2.52       # m^2: what 1.0 multiplies its drag coefficient by (the blueprint's chassis 1.8 x 1.4 m; its drag_area is unused)
        front_axle_x: 1.438      # m, actor frame (scensim_carla_world blueprint_boxes_1.0.yaml)
        rear_axle_x: -1.438      # m, actor frame (the same table)

simulators:
  isaac: carla-0.9.16           # Isaac's ego body is CARLA 0.9.16's model3 exported to USD

# The sensor kit: base_link -> sensor_kit_base_link, then each sensor's mount in the kit.
# Mounts are what csb's Isaac ego uses today (acb's acb_sensor_kit calibration).
sensor_kit:
  mount: {x: 0.9, y: 0.0, z: 2.0, roll: -0.001, pitch: 0.015, yaw: -0.0364}

sensors:
  top:
    type: lidar
    calibration_key: velodyne_top_base_link   # the key in sensor_kit_calibration.yaml
    link: top_base_link                       # URDF link the mount places
    frame: top                                # frame_id of the messages (child of link, identity)
    topic: /sensing/lidar/top/pointcloud_before_sync
    mount: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 1.575}
    channels: 128
    rate_hz: 20.0
    range: 200.0
    vertical_fov: [-25.0, 15.0]   # deg (CARLA's ray-cast lidar beside it)
    isaac:
      enabled: true
      config: OS1
      variant: OS1_REV7_128ch20hz1024res
    carla:
      key: top
      # The semantic lidar: the ray-cast lidar's points (no dropoff, no noise: what the
      # ray-cast one ran with) plus each hit's semantic tag and incidence, from which
      # acb_bridge makes the intensity below. The ray-cast lidar's own intensity is the
      # atmosphere's attenuation by range alone (1.0, so 255, with none), the same on road
      # and car; a detector that reads intensity (TransFusion) then sees nothing.
      blueprint: sensor.lidar.ray_cast_semantic
      # channels, range, rotation_frequency (rate_hz) and the vertical field of view come
      # from the fields above; these are CARLA's own.
      attributes:
        points_per_second: 2621440
        sensor_tick: 0.0
        horizontal_fov: 360.0
      # Intensity (uint8) = reflectance[tag] x cos(incidence), clamped to 0-255: a
      # reflectivity-reporting lidar (Hesai/Ouster-like: diffuse 0-100, retroreflectors
      # above) on Lambertian surfaces. Dark road and grey ground low, painted lines, cars and
      # structures higher, signs retroreflective. Roadmap 074 S5 (swb 118): a replay with
      # road 5 and everything else 60 brought TransFusion's detection of the oncoming car
      # from 0 to 0.97 of frames at 10-20 m; one flat value (20 or 255) detects nothing.
      intensity:
        default: 30
        reflectance:
          NONE: 30
          Roads: 5
          RoadLines: 50
          Sidewalks: 12
          Ground: 12
          Terrain: 20
          Water: 2
          RailTrack: 15
          Bridge: 25
          Buildings: 40
          Walls: 40
          Fences: 45
          GuardRail: 60
          Poles: 50
          TrafficLight: 50
          TrafficSigns: 150
          Vegetation: 45
          Static: 40
          Dynamic: 45
          Other: 30
          Sky: 0
          Pedestrians: 50
          Rider: 50
          Car: 90
          Truck: 90
          Bus: 90
          Train: 80
          Motorcycle: 80
          Bicycle: 60
  camera6:
    type: camera
    calibration_key: camera6/camera_link
    link: camera6/camera_link
    frame: camera6/camera_optical_link
    topic: /sensing/camera/camera6/image_raw
    info_topic: /sensing/camera/camera6/camera_info
    mount: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
    width: 1280
    height: 720
    horizontal_fov: 74.5    # deg
    rate_hz: 10.0
    isaac:
      # Off as on csb today: traffic lights reach Autoware by V2X (fusion only), not this camera.
      enabled: false
    carla:
      key: camera6/camera_link
      blueprint: sensor.camera.rgb
  imu:
    type: imu
    calibration_key: imu_link
    link: imu_link
    frame: imu_link
    topic: /sensing/imu/imu_link/imu_raw
    mount: {x: 0.0, y: 0.0, z: 0.0, roll: 3.14159265359, pitch: 0.0, yaw: 3.14159265359}
    isaac:
      enabled: true
    carla:
      key: imu_link
      blueprint: sensor.other.imu
      attributes:
        sensor_tick: 0.01
  gnss:
    type: gnss
    calibration_key: gnss_link
    link: gnss_link
    frame: gnss_link
    topic: /sensing/gnss/gnss_link/nav_sat_fix
    mount: {x: -0.1, y: 0.0, z: -0.2, roll: 0.0, pitch: 0.0, yaw: 0.0}
    rate_hz: 10.0
    isaac:
      enabled: true
    carla:
      key: gnss_link
      blueprint: sensor.other.gnss

# Where each number comes from. `assumed: true` marks an estimate to replace with a
# measurement when one exists.
provenance:
  body.ground_clearance: {basis: "Tesla Model 3 specifications (Rear-Wheel Drive, 2024-2026): ground clearance 138 mm (5.4 in), unladen. The real car's figure on every body: the underbody is where Tesla puts it, not raised with a larger wheel"}
  geometry: {basis: "the real car: Tesla Model 3 (2024) wheel base 2875 mm, track 1580 mm, length 4694 mm, width 1849 mm without mirrors (2088 with), height 1443 mm; the 235/45R18 tire's radius 0.334 m; the overhangs from the length about the axles (0.841 front, 0.977 rear) and the width with mirrors about the track (0.254 a side). CARLA 1.0's vehicle.tesla.model3 measures the same to the millimetre (bodies.carla-1.0)"}
  bodies.carla-0.9.16.geometry: {basis: "CARLA 0.9.16 vehicle.tesla.model3, measured: wheel base, track and radius from physics_control (acb's extract_vehicle_params.py, scensim's blueprint table); the overhangs from the actor's box against the axles (roadmap 050: the rear axle is 1.386 m behind the actor origin, the box centre 0.029 ahead, so 0.807 front and 0.980 rear (the body 4.792 m with the 3.005 m wheel base, itself 3.0046 rounded), not the 0.923 / 0.864 a centred wheel base gives)"}
  bodies.carla-0.9.16.powertrain.gear_ratio: {basis: "Tesla's 9.03:1 scaled by 0.370 / 0.334 m (the body's wheel vs the Model 3's 235/45R18) so the force at the road and the motor speed per road speed are the real car's; 10.0 as the pedal maps were measured"}
  bodies.carla-1.0.geometry: {basis: "CARLA 1.0 vehicle.tesla.model3, measured 2026-11-18 (scensim_carla_world blueprint_boxes_1.0.yaml): box 4.694 x 2.088 x 1.443 m centred 0.068 m behind the actor origin, axles at +-1.438 m, track 1.58 m, wheel radius 0.336 m"}
  bodies.carla-1.0.powertrain.gear_ratio: {basis: "Tesla's 9.03:1 scaled by 0.336 / 0.334 m, as for carla-0.9.16"}
  bodies.carla-1.0.carla.physics_1_0: {basis: "measured 2026-11-18 on the packaged CARLA 1.0 (roadmap 083 step 5, chaos_measure.py): locked-wheel mu 0.50 x friction_force_multiplier + 0.035, so 1.94 for a tire friction of 1.0; drag Cd x the blueprint's chassis 1.8 x 1.4 m, its drag_area unused"}
  inertia.mass: {basis: "Model 3 RWD (2024) curb mass 1760 kg (evspecifications.com/en/model/5f1c3d0)"}
  inertia.com_front_fraction: {assumed: true, basis: "road-test weight splits around 47-48 % front; the RWD's rear motor puts it at the low end"}
  inertia.com_height: {assumed: true, basis: "a floor battery pack puts the CoM low"}
  inertia.inertia_box: {assumed: true, basis: "uniform box of the body: yaw 3909 kg m^2 at 1760 kg, close to m a b = 3959"}
  wheels.mass: {assumed: true, basis: "a wheel and tire of this size"}
  tires: {assumed: true, basis: "dry asphalt; the PhysX vehicle's usual passenger-car tire"}
  tires.friction_vs_slip: {assumed: true, basis: "dry asphalt grip falls past its peak to 0.65 (Burckhardt model, dry asphalt: c1 1.2801, c2 23.99, c3 0.52: peak 1.17 at slip 0.17, 0.76 locked) to 0.92 (Pacejka Magic Formula, dry tarmac B 10, C 1.9, D 1, E 0.97, as in MathWorks' Tire-Road Interaction (Magic Formula) block: 0.91 locked) of the peak when the wheel locks; 0.8 is between. The peak sits at 0.1 because this PhysX tire's force saturates there (longitudinal stiffness 10 x the rest load). User decision 2026-10-19; it applies to ideal and ev alike"}
  brakes.max_brake_torque: {basis: "chosen past the tire limit, so a stop is friction-limited (~1 g) as on a real car"}
  brakes.dead_time: {assumed: true, basis: "a brake-by-wire booster (Model 3: Bosch iBooster) builds pressure in ~0.1-0.2 s; dead time of order 0.1 s"}
  brakes.time_constant: {assumed: true, basis: "with dead_time: ~95 % of the requested pressure 0.26 s after the request"}
  brakes.abs: {assumed: true, basis: "tuned in Isaac (aib.steptest brake_100, 2026-10-19): PhysX slip at the tire peak is ~0.1-0.13 under braking load; release past 0.25 / reapply below 0.15 at 8 / 4 per s stopped shortest of five settings on a realistic friction curve, and never locked"}
  powertrain.max_drive_torque: {basis: "chosen: ~8 m/s^2, beyond what Autoware asks (ideal)"}
  powertrain.drive_axle: {basis: "Model 3 RWD: one rear permanent-magnet motor (3D7), no front motor (Tesla Model 3 owner's manual, Motor Type(s))"}
  powertrain.gear_ratio: {basis: "Tesla Model 3 owner's manual: single-speed fixed gear 9.03:1; each body scales it to its own wheel (bodies.<name>.powertrain.gear_ratio)"}
  powertrain.motor_peak_torque: {basis: "Tesla Model 3 owner's manual, motor 3D7: 194 kW, 340 N m; evspecifications lists 194 kW at 5400 rpm (440 N m there is not Tesla's figure)"}
  powertrain.motor_peak_power: {basis: "Tesla Model 3 owner's manual, motor 3D7: 194 kW; peak, i.e. battery and inverter permitting"}
  powertrain.motor_max_rpm: {assumed: true, basis: "set so that the taper reaches Tesla's 201 km/h top speed (Model 3 RWD 2024)"}
  powertrain.motor_time_constant: {assumed: true, basis: "inverter torque response is a few ms; the driveline's anti-jerk shaping makes the wheel torque's tens of ms"}
  powertrain.regen_max_torque: {assumed: true, basis: "Tesla quoted 0.2 g maximum regen deceleration for Model 3 (0.3 g in Track Mode; Electrek 2018); 0.2 g x 1760 kg x 0.334 m / 9.03 (the same on every body: radius over reduction is the real car's)"}
  powertrain.regen_max_power: {assumed: true, basis: "owner reports of ~60-70 kW peak regen for Model 3 (no Tesla figure); 60 kW"}
  powertrain.regen_fade_speeds: {assumed: true, basis: "regen fades out at walking pace, where the friction brakes (hold) take over"}
  powertrain.traction_control: {assumed: true, basis: "slip limit just past the PhysX tire's peak under drive; motor torque cut fast (the inverter acts in ms)"}
  resistance.rolling_coefficient: {assumed: true, basis: "low-rolling-resistance OEM tires (Model 3: Michelin Primacy MXM4 class), Crr 0.008-0.010"}
  resistance.drag_coefficient: {basis: "Tesla: Cd 0.23 for Model 3"}
  resistance.frontal_area: {assumed: true, basis: "~2.2 m^2, InsideEVs / Engineering Explained estimate (from the Model S's)"}
  suspension: {assumed: true, basis: "a sedan's ride"}
  isaac.physx: {basis: "csb roadmap 043: the braking instability fix"}
  bodies.carla-0.9.16.carla.physics.tire_friction_scale: {basis: "measured (roadmap 051 K3, scripts/carla_step_response.py): 1.2 stops from 100 km/h at full brake in 42.8 m, Isaac's ev on this spec in 42.9 (ABS) to 44.1 (locked); CARLA's own 3.5 stops in 22 m once the brakes can lock the wheels, ~1.7 g"}
  bodies.carla-0.9.16.carla.physics.drag_area: {assumed: true, basis: "UE4's PhysX vehicle drags with ChassisWidth x ChassisHeight; the body's box, 2.163 x 1.488 m"}
  bodies.carla-0.9.16.carla.physics.body_com: {assumed: true, basis: "the centre of the body's box (CARLA does not expose the centre UE computes from the collision)"}
  bodies.carla-0.9.16.carla.physics.rear_axle_x: {basis: "measured: scensim_carla_world blueprint_boxes_0.9.16.yaml axles"}
  bodies.carla-0.9.16.carla.physics.max_steer_angle_deg: {basis: "CARLA 0.9.16 vehicle.tesla.model3 front wheels; acb_bridge's steering map is built on it"}
  bodies.carla-0.9.16.carla.physics.engine_moi: {basis: "measured (roadmap 051 K3): with 0.05 and engine_damping 0.01, 0-100 km/h in 6.3 s against Isaac's 6.45 (CARLA's own 1.0 and 0.15-2.0: 10.9 s, and a 6.3 m/s^2 coast at 25 m/s through the 10:1 reduction)"}
  bodies.carla-0.9.16.carla.physics.engine_damping: {basis: "measured (roadmap 051 K3): coasting at 25 m/s 0.20 m/s^2 against Isaac's 0.276, the difference CARLA's missing rolling resistance (~0.09)"}
  sensors: {basis: "acb acb_sensor_kit calibration, as csb's Isaac ego mounts it; the carla blocks are acb_bridge's vehicle_config.yaml"}
